<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share Your Location</title>
<style>
:root{color-scheme:light;--ink:#19252e;--muted:#63717b;--accent:#2563eb;--bg:#f3f6fa}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#eaf1ff,#f8fbff 55%,#e8f8f2);min-height:100vh;display:grid;place-items:center;padding:22px;color:var(--ink)}
.card{width:min(100%,440px);background:#fff;border-radius:24px;padding:28px;box-shadow:0 18px 50px rgba(31,55,90,.12)}
.icon{width:58px;height:58px;border-radius:18px;background:#eaf1ff;display:grid;place-items:center;font-size:28px;margin-bottom:16px}h1{font-size:24px;margin:0 0 8px}p{color:var(--muted);line-height:1.55;margin:0 0 18px}
button{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:650;cursor:pointer;margin-top:10px}.primary{background:var(--accent);color:white}.secondary{background:#edf2f7;color:var(--ink)}button:disabled{opacity:.55;cursor:not-allowed}
#result{display:none;margin-top:18px;background:#f6f8fb;border-radius:14px;padding:14px;overflow-wrap:anywhere}.coords{font-size:14px;font-weight:600;margin-bottom:8px}.small{font-size:12px;color:var(--muted);margin-top:16px}.status{min-height:22px;font-size:14px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<main class="card">
<div class="icon" aria-hidden="true">📍</div>
<h1>Share your location</h1>
<p>This page will request your device's location only when you tap the button below. Your location is not uploaded or saved by this page.</p>
<button class="primary" id="getLocation">Allow & show my location</button>
<div class="status" id="status" aria-live="polite"></div>
<div id="result">
<div class="coords" id="coords"></div>
<button class="secondary" id="mapsBtn">Open in Google Maps</button>
<button class="secondary" id="shareBtn">Share location link</button>
</div>
<p class="small">You can cancel the browser permission request or close this page at any time.</p>
</main>
<script>
const getBtn=document.getElementById('getLocation'),statusEl=document.getElementById('status'),result=document.getElementById('result'),coordsEl=document.getElementById('coords'),mapsBtn=document.getElementById('mapsBtn'),shareBtn=document.getElementById('shareBtn');
let mapsUrl='';
getBtn.addEventListener('click',()=>{
 if(!navigator.geolocation){statusEl.textContent='Location is not supported by this browser.';return;}
 statusEl.textContent='Requesting location permission…';getBtn.disabled=true;
 navigator.geolocation.getCurrentPosition(pos=>{
  const lat=pos.coords.latitude.toFixed(6),lon=pos.coords.longitude.toFixed(6);
  mapsUrl=`https://www.google.com/maps?q=${lat},${lon}`;
  coordsEl.textContent=`Latitude: ${lat} · Longitude: ${lon}`;
  result.style.display='block';statusEl.textContent='Location received on this device. Choose how you want to share it.';getBtn.disabled=false;
 },err=>{statusEl.textContent=err.code===1?'Permission denied. You did not share your location.':'Could not get location. Try again outdoors or check device settings.';getBtn.disabled=false;},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
});
mapsBtn.addEventListener('click',()=>{if(mapsUrl)window.open(mapsUrl,'_blank','noopener');});
shareBtn.addEventListener('click',async()=>{if(!mapsUrl)return;try{if(navigator.share){await navigator.share({title:'My location',text:'Here is my location:',url:mapsUrl});}else{await navigator.clipboard.writeText(mapsUrl);statusEl.textContent='Location link copied. Paste it into your chat.';}}catch(e){if(e.name!=='AbortError')statusEl.textContent='Sharing was cancelled or unavailable.';}});
</script>
</body>
</html>
